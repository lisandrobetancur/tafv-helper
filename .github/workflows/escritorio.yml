# Construye los instaladores de la versión de escritorio (Windows .exe y Mac .dmg) en GitHub.
# Corre en cada push a la rama escritorio (y a mano: Actions › «Escritorio» › «Run workflow»).
# Los instaladores se publican en Releases («Escritorio AAAA.MM.DD-N») y quedan también en «Artifacts».
name: Escritorio

on:
  push:
    branches: [escritorio]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: Instalador-Windows
            archivo: dist/Instalador-Biblioteca-de-Estudio.exe
          - os: macos-latest          # Mac con procesador Apple (M1, M2…)
            artefacto: Instalador-Mac-Apple
            archivo: dist/Biblioteca-de-Estudio.dmg
          - os: macos-15-intel        # Mac con procesador Intel
            artefacto: Instalador-Mac-Intel
            archivo: dist/Biblioteca-de-Estudio.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check -q -r requirements-escritorio.txt
      - name: Construir
        env:
          PYTHONIOENCODING: utf-8
        run: python escritorio/construir.py
      - name: Nombre del archivo según el equipo
        shell: bash
        run: |
          ext="${{ matrix.archivo }}"; ext="${ext##*.}"
          mkdir -p salida && cp "${{ matrix.archivo }}" "salida/${{ matrix.artefacto }}.${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: salida/*
          if-no-files-found: error
          retention-days: 30

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="escritorio-$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$etiqueta" instaladores/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Escritorio $(date -u +%Y.%m.%d) (${{ github.run_number }})" \
            --notes "Instaladores de la Biblioteca de Estudio (versión de escritorio). Windows: Instalador-Windows.exe · Mac con procesador Apple: Instalador-Mac-Apple.dmg · Mac Intel: Instalador-Mac-Intel.dmg. Guía de instalación y activación en ESCRITORIO.md."
