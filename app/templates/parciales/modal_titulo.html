{% from "macros.html" import icono %}
<dialog class="modal !w-[min(560px,calc(100vw-2rem))]" x-data="modal" aria-labelledby="t-titulo">
  <form hx-post="/tablas/{{ tabla.id }}/titulo" hx-confirm="¿Usar esta columna como título de todas las fichas?"
        data-confirmar-boton="Cambiar título" class="flex max-h-[90vh] flex-col">
    <header class="flex items-start justify-between gap-4 border-b border-borde px-6 py-4">
      <div>
        <h2 id="t-titulo" class="text-lg font-semibold">Columna del título</h2>
        <p class="text-sm text-tenue">El título identifica cada ficha en la tabla, la búsqueda y el diagnóstico.</p>
      </div>
      <button type="button" class="btn-icono -mr-2" @click="cerrar()" aria-label="Cerrar">{{ icono("x", "size-5") }}</button>
    </header>
    <fieldset class="flex min-w-0 flex-col gap-2 overflow-y-auto px-6 py-5">
      <legend class="sr-only">Columnas</legend>
      {% for c in tabla.columnas %}
      {% set muestras = ejemplos.get(c.clave, [])|select|map("replace", "\n", " · ")|list %}
      <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-borde px-4 py-3 hover:bg-superficie-2/60
                    has-[:checked]:border-marca has-[:checked]:bg-marca-suave">
        <input type="radio" name="clave" value="{{ c.clave }}" class="mt-1 accent-[var(--color-marca)]" {{ "checked" if c.clave == tabla.columna_titulo }}>
        <span class="min-w-0 flex-1">
          <span class="block font-medium">{{ c.nombre }}{% if c.clave == tabla.columna_titulo %} <span class="text-xs font-normal text-tenue">(actual)</span>{% endif %}</span>
          {% if muestras %}<span class="block truncate text-xs text-tenue">{% for m in muestras %}{{ m|truncate(40, true, "…") }}{{ ", " if not loop.last }}{% endfor %}</span>{% endif %}
        </span>
      </label>
      {% endfor %}
    </fieldset>
    <footer class="flex justify-end gap-2 border-t border-borde bg-superficie-2/50 px-6 py-4">
      <button type="button" class="btn-secundario" @click="cerrar()">Cancelar</button>
      <button type="submit" class="btn-primario">Guardar</button>
    </footer>
  </form>
</dialog>
