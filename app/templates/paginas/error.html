{% extends "paginas/aislada.html" %}
{% block titulo %}{{ "No encontrado" if estado == 404 else "Algo salió mal" }}{% endblock %}
{% block contenido %}
<h1 class="text-xl font-bold">{{ "No encontramos lo que buscabas" if estado == 404 else "Algo salió mal" }}</h1>
<p class="mt-3 text-tenue">{{ mensaje }}</p>
<div class="mt-7 flex justify-center gap-2">
  <a href="javascript:history.back()" class="btn-secundario">Volver</a>
  <a href="/" class="btn-primario">Ir al inicio</a>
</div>
{% endblock %}
